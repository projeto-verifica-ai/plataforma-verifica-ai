<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verifica AÍ - Proteja-se de Fake News</title>
    <!-- Melhores práticas de SEO: Inclusão de meta tags básicas -->
    <meta
      name="description"
      content="ChatBot do Verifica AÍ - Interaja com nosso assistente virtual para aprender a identificar golpes, fake news e conteúdos gerados por IA. Desenvolva seu pensamento crítico de forma simples e acessível."
    />
    <!-- Fontes do Google (Outfit e Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="chatBot.css" />
    <link rel="stylesheet" href="../../style.css" />
  </head>

  <body class="chatbot-page">
    <header class="headerChatBot">
      <!-- Logo padrão do Verifica AÍ -->
      <div class="logo">
        <img
          src="../../assets/mascot/verificaai-robot-nobackground.webp"
          alt="Ícone do Verifica AÍ"
          class="logo-icon"
          width="40"
          height="40"
          decoding="async"
        />
        <span class="logo-text">Verifica AÍ</span>
        <img
          src="../../assets/icons/icone-verificado.png"
          alt="Verificado"
          class="icon-verified"
          width="16"
          height="16"
          decoding="async"
        />
      </div>
      <!-- Botão para sair da janela do ChatBot -->
      <a
        href="../../Pages/dashboard-principal/dashboard-principal.html"
        id="btnClose"
        class="btn-close"
        aria-label="Voltar para a página inicial"
      >
        <span class="btn-close-text">Voltar ao início</span>
        <svg
          viewBox="0 0 24 24"
          width="15"
          height="15"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M6 6l12 12M18 6L6 18"
            stroke="#fff"
            stroke-width="2.4"
            stroke-linecap="round"
          />
        </svg>
      </a>
    </header>

    <!-- ======================== ÁREA DE MENSAGENS ======================== -->
    <main class="chat-messages" id="chatMessages">
      <!-- Campo das mensagens -->
      <div
        class="chat-messages-inner"
        id="chatMessagesInner"
        aria-live="polite"
        aria-label="Conversa com o assistente"
      >
        <!-- Estado Inicial, enquanto o chat estiver vazio. -->
        <div class="empty-state" id="emptyState">
          <p class="empty-title">Antes de confiar, verifique.</p>
          <p class="empty-sub">Digite sua dúvida abaixo ou envie um arquivo.</p>
          <p class="empty-sub">
            Esta IA serve apenas como auxílio, e pode cometer erros! Utilize
            mais de uma fonte para confirmar
          </p>
        </div>
      </div>
    </main>

    <footer class="footerChatBot">
      <div class="attachment-preview" id="attachmentPreview" hidden>
        <img src="../../assets/icons/attach-white.png" alt="" width="15" height="15" decoding="async" />
        <span id="attachmentName"></span>
        <button type="button" id="removeAttachment" aria-label="Remover anexo">
          <span class="sr-only">Remover anexo</span>
          <svg viewBox="0 0 24 24" width="13" height="13">
            <path
              d="M6 6l12 12M18 6L6 18"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>
      <form class="chat-area" id="chatForm">
        <label class="attach-label" for="fileInput" title="Enviar arquivo">
          <img src="../../assets/icons/attach-white.png" alt="Enviar arquivo" width="18" height="18" decoding="async" />
          <span>Enviar arquivo</span>
        </label>
        <input
          type="file"
          id="fileInput"
          hidden
          accept="image/*,video/*,audio/*"
        />
        <label class="sr-only" for="textInput"
          >Digite sua pergunta ou descreva o arquivo enviado</label
        >
        <input
          type="text"
          id="textInput"
          class="chat-input"
          placeholder="Digite sua pergunta aqui"
          autocomplete="off"
        />
        <button type="submit" class="send-btn" aria-label="Enviar">
          <img src="../../assets/icons/send-white.png" alt="" width="18" height="18" decoding="async" />
          <span>Enviar</span>
        </button>
      </form>
    </footer>

    <script type="module" src="chatbot.js"></script>
  </body>
</html>
