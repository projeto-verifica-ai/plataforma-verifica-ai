<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifica AI - Proteja-se de Fake News</title>

    
    <!-- Fontes do Google (Outfit e Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
</head>

<body>

    <main class="container">

        <!-- Lado esquerdo -->
        <section class="welcome">

            <h1>Bem vindo!</h1>

            <div class="robot">
                <img src="../../assets/verificaai-robot-icon.png" alt="Robô">
            </div>

            <div class="register">
                <p>Não tem uma conta?</p>
                <a href="#">Cadastre-se →</a>
            </div>

        </section>

        <!-- Lado direito -->
        <section class="login">

            <h2>
                Acesse sua <span>conta.</span>
            </h2>

            <!-- Login Social -->
            <div class="social-login">

                <button>
                    <img src="../../assets/icons/facebook-logo.png" alt="">
                    Entrar com Facebook
                </button>

                <button>
                    <img src="../../assets/icons/google-logo.png" alt="">
                    Entrar com Google
                </button>

            </div>

            <!-- Separador -->
            <div class="separator">
                <hr>
                <span>ou</span>
                <hr>
            </div>

            <!-- Formulário -->
            <form>

                <div class="input-group">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="E-mail ou nome"
                    >
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Senha"
                    >
                </div>

                <!-- Opções -->
                <div class="options">

                    <label>
                        <input type="checkbox">
                        Lembrar de senha
                    </label>

                    <a href="#">Esqueceu sua senha?</a>

                </div>

                <button type="submit">
                    Login
                </button>

            </form>

        </section>

    </main>

</body>

</html>
